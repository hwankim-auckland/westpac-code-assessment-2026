name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bank-account-service
          path: target/*.jar
          if-no-files-found: ignore

      - name: Build docker image
        if: success()
        run: |
          BRANCH=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-')
          TAG="${BRANCH}-$(git rev-parse --short HEAD)"
          docker build -t "bank-account-service:${TAG}" .
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Push docker image
        if: success()
        run: echo "Pushing bank-account-service:${IMAGE_TAG} to a docker registry is out of scope."
