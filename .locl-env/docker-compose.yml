name: account-service-local-env

services:
  postgres:
    image: postgres:18.7
    container_name: db
    environment:
      POSTGRES_DB: accounts_db
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: some_strong_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d accounts_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.3
    container_name: cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
